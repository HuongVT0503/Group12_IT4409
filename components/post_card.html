<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Card Sample</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Post">
      <header class="card__header">
        <div class="avatar" aria-hidden="true"></div>
        <div class="user-meta">
          <div class="user-meta__name">Username</div>
          <div class="user-meta__time">2h ago</div>
        </div>
      </header>

      <p class="card__text">Post text......... [sample post]</p>

      <figure class="card__media" aria-label="Attached image placeholder"></figure>

      <footer class="card__actions" aria-label="Post actions">


        
        <button class="action" type="button" aria-label="Like">
          <svg class="action__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M20.8 12.1c0 4.6-6.8 8.2-8.8 9.3-2-1.1-8.8-4.7-8.8-9.3 0-2.5 2-4.6 4.6-4.6 1.7 0 3.2.9 4.2 2.2 1-1.3 2.5-2.2 4.2-2.2 2.6 0 4.6 2.1 4.6 4.6z" stroke-width="1.5"/>
          </svg>
          <span class="action__count">54</span>
        </button>

        <button class="action" type="button" aria-label="Comment">
          <svg class="action__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.8A8 8 0 1 1 21 12z" stroke-width="1.5"/>
          </svg>
          <span class="action__count">27</span>
        </button>

        <button class="action action--ghost" type="button" aria-label="More options">
          <!--share icon -->
        </button>
      </footer>
    </section>
  </main>
</body>
</html>
